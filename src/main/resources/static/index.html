<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 11px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn {
            background: #198754;
            color: white;
        }

        .clear-btn {
            background: #6c757d;
            color: white;
        }

        .edit-btn {
            background: #ffc107;
            color: black;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #343a40;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>

<body>

<h1>Student Management System</h1>

<div class="form-container">

    <div id="message" class="message"></div>

    <form id="studentForm">

        <!-- Hidden ID for Edit -->
        <input type="hidden" id="studentId">

        <input
            type="text"
            id="studentName"
            placeholder="Enter Student Name"
            required
        >

        <input
            type="email"
            id="studentEmail"
            placeholder="Enter Email"
            required
        >

        <input
            type="text"
            id="studentCourse"
            placeholder="Enter Course"
            required
        >

        <input
            type="number"
            id="studentAge"
            placeholder="Enter Age"
            min="1"
            required
        >

        <button type="submit" class="save-btn" id="saveButton">
            Save Student
        </button>

        <button
            type="button"
            class="clear-btn"
            onclick="clearForm()">
            Clear
        </button>

    </form>

</div>


<h2>Student List</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="studentTableBody">
    </tbody>
</table>


<script>

    // Backend API
    const API = "/api/students";


    // ==============================
    // Load All Students
    // ==============================

    async function loadStudents() {

        try {

            const response = await fetch(API);

            if (!response.ok) {
                throw new Error("Failed to load students");
            }

            const students = await response.json();

            const tableBody =
                document.getElementById("studentTableBody");

            tableBody.innerHTML = "";

            students.forEach(student => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.course}</td>
                    <td>${student.age}</td>

                    <td>
                        <button
                            class="edit-btn"
                            onclick="editStudent(${student.id})">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})">
                            Delete
                        </button>
                    </td>
                `;

                tableBody.appendChild(row);

            });

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to load students",
                "error"
            );
        }
    }


    // ==============================
    // Create / Update Student
    // ==============================

    document
        .getElementById("studentForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const id =
                document.getElementById("studentId").value;

            const name =
                document.getElementById("studentName").value.trim();

            const email =
                document.getElementById("studentEmail").value.trim();

            const course =
                document.getElementById("studentCourse").value.trim();

            const age =
                Number(document.getElementById("studentAge").value);


            // Create JSON object
            const student = {
                name: name,
                email: email,
                course: course,
                age: age
            };


            console.log("Sending data:", student);


            try {

                const url =
                    id ? API + "/" + id : API;

                const method =
                    id ? "PUT" : "POST";


                const response = await fetch(url, {

                    method: method,

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(student)

                });


                if (response.ok) {

                    if (id) {

                        showMessage(
                            "Student updated successfully!",
                            "success"
                        );

                    } else {

                        showMessage(
                            "Student created successfully!",
                            "success"
                        );
                    }


                    clearForm();

                    loadStudents();

                } else {

                    const errorText =
                        await response.text();

                    console.error(
                        "Backend Error:",
                        errorText
                    );

                    showMessage(
                        "Error: " + errorText,
                        "error"
                    );
                }

            } catch (error) {

                console.error(error);

                showMessage(
                    "Unable to connect to server",
                    "error"
                );
            }

        });


    // ==============================
    // Edit Student
    // ==============================

    async function editStudent(id) {

        try {

            const response =
                await fetch(API + "/" + id);


            if (!response.ok) {

                throw new Error(
                    "Student not found"
                );
            }


            const student =
                await response.json();


            document.getElementById("studentId").value =
                student.id;

            document.getElementById("studentName").value =
                student.name;

            document.getElementById("studentEmail").value =
                student.email;

            document.getElementById("studentCourse").value =
                student.course;

            document.getElementById("studentAge").value =
                student.age;


            document.getElementById("saveButton").innerText =
                "Update Student";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to load student",
                "error"
            );
        }
    }


    // ==============================
    // Delete Student
    // ==============================

    async function deleteStudent(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this student?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    API + "/" + id,
                    {
                        method: "DELETE"
                    }
                );


            if (response.ok) {

                showMessage(
                    "Student deleted successfully!",
                    "success"
                );

                loadStudents();

            } else {

                const errorText =
                    await response.text();

                showMessage(
                    "Delete failed: " + errorText,
                    "error"
                );
            }

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to server",
                "error"
            );
        }
    }


    // ==============================
    // Clear Form
    // ==============================

    function clearForm() {

        document
            .getElementById("studentForm")
            .reset();


        document
            .getElementById("studentId")
            .value = "";


        document
            .getElementById("saveButton")
            .innerText = "Save Student";
    }


    // ==============================
    // Show Message
    // ==============================

    function showMessage(message, type) {

        const messageBox =
            document.getElementById("message");


        messageBox.innerText = message;

        messageBox.className =
            "message " + type;

        messageBox.style.display = "block";


        setTimeout(() => {

            messageBox.style.display = "none";

        }, 3000);
    }


    // ==============================
    // Initial Load
    // ==============================

    loadStudents();

</script>

</body>
</html>
