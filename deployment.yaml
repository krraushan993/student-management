apiVersion: apps/v1

kind: Deployment

metadata:
  name: student-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-management

  template:
    metadata:
      labels:
        app: student-management

    spec:
      containers:
        - name: student-management
          image: raushan993/student-management:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8081